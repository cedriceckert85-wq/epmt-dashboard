version: 2
project:
  name: lol-ai-cutter
  main_branch: main
  canonical_state: state/project_state.json
  current_task: state/current_task.json
  journal: state/journal.jsonl
  generated_state_markdown: PROJECT_STATE.md
  generated_task_markdown: CURRENT_TASK.md
  worktree_root: .orchestrator/worktrees
  artifact_root: .orchestrator/artifacts
  lock_file: state/orchestrator.lock
agents:
  claude:
    executable: claude
    timeout_s: 3600
    max_retries: 2
  codex:
    executable: codex
    timeout_s: 3600
    max_retries: 2
retry:
  infrastructure_backoff_s:
  - 5
  - 20
  invalid_schema_retries: 1
  max_fix_cycles: 2
security:
  immutable_paths:
  - .git
  - state
  - schemas
  - phases
  - ORCHESTRATOR_CONFIG.yaml
  - PROJECT_STATE.md
  - CURRENT_TASK.md
  - reports/human-gates
  - reports/acceptance
  - test_registry.yaml
  test_env_must_strip_provider_secrets: true
git:
  require_clean_main: true
  merge_strategy: ff-only
  agents_may_commit: false
human_gates:
  record_dir: reports/human-gates
acceptance:
  record_dir: reports/acceptance
  schema: schemas/finding_acceptance.schema.json
test_registry: test_registry.yaml
gate_policy:
  review_acceptance_source: orchestrator_or_human_only
  require_sha_invariant: true
  require_legal_lifecycle_transition: true
  human_approval_must_bind_exact_sha: true
retryable_exit_codes:
- 75
path_policy:
  precedence: immutable_over_allowed
  rule: A path matching an immutable path or any descendant of one is forbidden even
    if its parent is allowed.
