version: 1
conventions:
  evidence_root: .orchestrator/artifacts/{run_id}/
  parser:
    exit_code: exit 0 == PASS, no metrics
    pytest_junit: exit code + junit xml as evidence
    metrics_json: 'exit 0 == PASS AND evidence json {"metrics": {...}} feeds gate metrics'
  requires: orchestrator doctor must verify each requirement before running; unmet requirement => UNVERIFIED, never skipped-as-pass
  implemented_in_phase: harness/tests are BUILT in that phase; the registry entry is normative from day 1
tests:
  phase_00_tests:
    command: python -m pytest tests/unit -q --junitxml=.orchestrator/artifacts/{run_id}/phase00_junit.xml
    cwd: .
    timeout_s: 900
    requires:
    - none
    parser: pytest_junit
    evidence: .orchestrator/artifacts/{run_id}/phase00_junit.xml
    implemented_in_phase: '00'
    produces_metrics: []
  phase_01_tests:
    command: python -m pytest tests/phase01 -q --junitxml=.orchestrator/artifacts/{run_id}/phase01_junit.xml
