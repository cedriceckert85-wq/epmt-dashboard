id: '01'
name: Architecture/Data Model
builder: codex
reviewer: claude
cross_vendor_review: true
human_gate: true
required_tests:
- phase_01_tests
- schema_roundtrip
- migration_up_down
allowed_write_paths:
- src/
- tests/
- docs/
- reports/
- schemas/
- migrations/
- config/
- assets/
- runbooks/
gate:
  max_blockers: 0
  max_unaccepted_high: 0
metrics:
# schema_validation_failures was redundant: schema_roundtrip (pytest_junit)
# passing already means zero schema-validation failures, and a pytest_junit
# test emits no metric to gate on. migration_reversible IS produced by
# migration_up_down (metrics_json), so it stays.
- name: migration_reversible
  op: ==
  value: 1
review_prompts:
- prompts/build/phase-01.md
- prompts/review/adversarial-clock-domain.md
- prompts/review/adversarial-tests-lying.md
