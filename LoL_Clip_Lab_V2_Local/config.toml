# LoL Clip Lab — local config. Every value here has a sane default in code;
# this file just makes them easy to tweak. Tuned for a Ryzen 7 5800X3D +
# Radeon RX 9070 XT (AMD): CPU whisper, AMF/x264 encoding, no CUDA/NVENC.
# Requires Python 3.11+ to be read (older Python ignores this file and uses
# the built-in code defaults — those match this file EXCEPT llm_cmd_b, which
# is disabled in code and enabled here).

# Your channels — each moment gets tagged with every channel it serves, and
# the edit sheet ends with a per-channel plan (+ chapters.txt for the uncut
# upload). Rename these to your actual channels.
channels = [
  { name = "shorts", note = "vertical 9:16 short, hook in the first 2 seconds, ideally under 60s" },
  { name = "main",   note = "edited highlight video for the main channel" },
  { name = "uncut",  note = "full-session upload; the best moments become chapter markers" },
]

[whisper]
whisper_model = "small"       # tiny | base | small | medium  (small = good speed/quality on 5800X3D)
whisper_device = "cpu"        # cpu is correct for AMD; "cuda" is NVIDIA-only
whisper_compute_type = "int8" # int8 = fast on CPU
whisper_language = "auto"     # auto | de | en
whisper_vad = true            # skip silence -> much faster on long VODs

[reactions]
reaction_frame_ms = 50
reaction_min_gap_s = 2.0
reaction_prominence = 0.55    # 0..1 — higher = only the biggest reactions
reaction_baseline_window_s = 20.0
reaction_cooccurrence_window_s = 8.0  # reaction near a game event boosts it
reaction_cooccurrence_boost = 1.5

[ranking]
w_signal = 0.45               # how much the raw audio/event signal counts
w_semantic = 0.55             # how much the editorial brain's judgement counts
cluster_merge_gap_s = 10.0
top_k = 12
top_per_10min = 4             # per-10-min cap so one busy stretch can't crowd out the rest

[cuts]
clip_min_s = 8.0
clip_max_s = 45.0
funny_setup_preroll_s = 6.0   # comedy needs its setup
punchline_decay_s = 2.5       # end a beat shortly after its punchline
default_preroll_s = 4.0
default_postroll_s = 3.0
reaction_preroll_s = 2.0      # pre/post-roll for pure reaction moments
reaction_postroll_s = 4.0

[editorial]
use_llm = true                # the creative core: humor / callbacks / punchlines
llm_cmd = ["claude", "-p"]    # any CLI that reads a prompt on stdin and prints JSON
# SECOND brain: Codex reviews every clip too — scores get blended, extra finds
# added, the sheet shows "llm+2nd". Skipped automatically when the CLI is not
# installed. Set [] to disable. If your CLI takes the prompt as an ARGUMENT
# instead of stdin, use a "{prompt}" placeholder (mind OS arg-length limits).
llm_cmd_b = ["codex", "exec", "-"]
llm_timeout_s = 240
llm_max_moment_calls = 40     # max candidate windows sent to the moment pass
discover_no_event_windows = 8 # let the LLM surface funny talk moments with no game event
# the session pass reads the WHOLE stream script — long VODs go in chunks of
# this many characters, with the findings so far carried into the next chunk
llm_session_chunk_chars = 150000
llm_moment_context_s = 90.0   # log detail around each candidate in the moment pass
llm_moment_log_chars = 60000  # total moment-pass log budget (rest = even sample)

[memory]
memory_enabled = true               # the channel brain: remembers running gags across sessions
memory_file = "channel_memory.json" # relative -> stored next to the tool; delete it to forget
memory_max_gags = 40                # keep the brain compact: most-seen gags survive
memory_max_sessions = 20            # session summaries kept

[style]
style_enabled = true                # aim suggestions at the style learned from your reference clips
style_file = "style_profile.json"   # written by `clip_lab learn`; delete to forget the style
references_dir = "references"       # drop example clips you LIKE here, then run `learn`
style_probe_s = 120                 # seconds sampled per reference clip for cut-pace detection
style_scene_threshold = 0.35        # ffmpeg scene-change sensitivity (lower = more cuts detected)

[render]
encoder = "auto"              # auto | amf | x264 ; auto = AMF on the 9070 XT, else CPU x264
render_crf = 20               # x264 quality (lower = better/bigger)
render_vertical = false       # also emit a 9:16 crop for shorts/TikTok
